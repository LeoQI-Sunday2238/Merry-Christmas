<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Merry Christmas · 粒子圣诞树</title>
<link rel="preconnect" href="https://fastly.jsdelivr.net" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Alex+Brush&family=Great+Vibes&family=Noto+Serif+SC:wght@600;700&display=swap" />
<style>

  :root{ --pink:#ff9fc6; --rose:#ff6fa8; --gold:#ffd28a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#04020a;color:#fff;
    font-family:"Noto Serif SC","Songti SC",serif;}
  #scene{position:fixed;left:0;top:0;display:block;touch-action:none;cursor:grab;background:#04020a;z-index:0;
    transition:filter 1.35s cubic-bezier(.4,0,.2,1);}
  #scene:active{cursor:grabbing;}
  .bg{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(circle at 50% 40%, rgba(255,110,160,.12), transparent 46%),
      radial-gradient(circle at 50% 100%, rgba(255,180,140,.14), transparent 44%),
      radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.6) 100%);
  }

  /* —— 左上标题：流动镀金渐变 + 手写体 —— */
  .greet{position:fixed;left:max(6vw,22px);top:max(8vh,46px);pointer-events:none;z-index:3;
    opacity:0;animation:uiIn 1.4s ease 3.85s forwards;}
  .greet h1{
    display:inline-block;margin:0;padding-right:.08em;
    font-family:"Alex Brush","Great Vibes","Brush Script MT",cursive;font-weight:400;
    font-size:clamp(34px,7.8vw,66px);line-height:1.02;letter-spacing:.01em;
    background:linear-gradient(100deg,#fffafc 0%,#ffe7f1 18%,#ffb7d5 36%,#ffe0b0 52%,#fffdf9 68%,#ffc2dd 86%,#fff2f8 100%);
    background-size:240% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 5px rgba(255,160,205,.6)) drop-shadow(0 0 16px rgba(255,110,170,.45)) drop-shadow(0 0 40px rgba(255,90,150,.28));
    animation:sheen 7s linear infinite;
  }
  .greet p{margin:4px 0 0 5px;font-size:clamp(14px,3.2vw,21px);letter-spacing:.13em;font-weight:700;white-space:nowrap;
    color:#fff;text-shadow:0 0 10px rgba(255,150,200,.8),0 0 26px rgba(255,110,170,.45);}

  /* —— 右上按钮：Apple 风液态玻璃（无 mask，避免灰块） —— */
  .tools{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:4;
    opacity:0;pointer-events:none;animation:uiIn 1.3s ease 3.95s forwards;}

  .tools button{
    --mx:50%; --my:20%;
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:6px;
    appearance:none;border:0;border-radius:999px;padding:8px 14px 8px 12px;
    font-family:inherit;font-size:12.5px;font-weight:500;letter-spacing:.1em;
    color:rgba(250,252,255,.7);cursor:pointer;
    background:
      linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)),
      linear-gradient(180deg, rgba(255,214,234,.12), rgba(255,255,255,0) 62%);
    backdrop-filter:blur(28px) saturate(210%) brightness(1.18);
    -webkit-backdrop-filter:blur(28px) saturate(210%) brightness(1.18);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.5),
      inset 1px 0 0 rgba(148,232,255,.55),
      inset -1px 0 0 rgba(255,130,190,.62),
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -8px 14px -10px rgba(0,0,0,.42);
    transition:transform .5s cubic-bezier(.16,1.55,.35,1),
               box-shadow .35s ease, color .3s ease, background-color .3s ease, filter .2s ease;
  }

  /* 流动的液态光泽：单层渐变缓慢平移，不外溢 */
  .tools button::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    background:linear-gradient(115deg,
      rgba(255,186,224,.34) 0%, rgba(255,255,255,.03) 26%,
      rgba(158,232,255,.22) 50%, rgba(255,255,255,.03) 72%,
      rgba(255,206,162,.28) 100%);
    background-size:240% 100%;
    opacity:.42;
    animation:liquidFlow 10s ease-in-out infinite alternate;
  }
  @keyframes liquidFlow{0%{background-position:0% 50%}100%{background-position:100% 50%}}

  /* 跟随指针的镜面高光 */
  .tools button::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    background:radial-gradient(62px 44px at var(--mx) var(--my),
      rgba(255,255,255,.85), rgba(255,255,255,.26) 40%, rgba(255,255,255,0) 72%);
    opacity:.4;transition:opacity .3s ease;
  }
  .tools button:hover::after,.tools button.press::after{opacity:.95;}

  .tools button .lb{position:relative;z-index:2;}
  .tools button .dot{
    position:relative;z-index:2;
    width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:transparent;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);
    transition:background .3s ease, box-shadow .35s ease, transform .35s ease;
  }

  /* 开启态：整块玻璃被粉光点亮 */
  .tools button.on{
    color:#fff;
    background:
      linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)),
      linear-gradient(180deg, rgba(255,196,226,.42), rgba(255,110,172,.2) 60%, rgba(255,88,150,.14) 100%);
    backdrop-filter:blur(26px) saturate(230%) brightness(1.24);
    -webkit-backdrop-filter:blur(26px) saturate(230%) brightness(1.24);
    box-shadow:
      inset 0 0 0 1px rgba(255,206,233,.62),
      inset 1px 0 0 rgba(176,240,255,.6),
      inset -1px 0 0 rgba(255,120,185,.75),
      inset 0 0 22px rgba(255,120,180,.5),
      0 0 24px rgba(255,105,170,.5);
    text-shadow:0 0 10px rgba(255,150,200,.8);
  }
  .tools button.on .dot{
    background:#fff4fa;transform:scale(1.15);
    box-shadow:0 0 6px #fff, 0 0 13px rgba(255,120,182,.95), 0 0 22px rgba(255,90,158,.6);
  }

  /* 按压：明显压扁 + 变亮 */
  .tools button.press{
    transform:scale(.86,.91);filter:brightness(1.32);
    transition:transform .14s cubic-bezier(.3,.85,.45,1), filter .14s ease;
    box-shadow:
      inset 0 2px 9px rgba(0,0,0,.4),
      inset 0 0 0 1px rgba(255,255,255,.55),
      0 3px 10px -6px rgba(0,0,0,.7);
  }
  .tools button.boing{animation:boing .64s cubic-bezier(.2,1.7,.3,1);}
  @keyframes boing{
    0%{transform:scale(.86,.91)}
    36%{transform:scale(1.08,1.03)}
    66%{transform:scale(.98,1)}
    100%{transform:scale(1)}
  }

  .ripple{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    pointer-events:none;z-index:1;
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,190,222,.4) 40%,rgba(255,255,255,0) 70%);
    animation:rip .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rip{0%{transform:scale(.3);opacity:.95}100%{transform:scale(12);opacity:0}}

  .clickglow{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
    background:radial-gradient(circle at 50% 50%,rgba(255,206,232,.55),rgba(255,150,200,.24) 46%,rgba(255,255,255,0) 72%);
    animation:clickglow .72s ease-out forwards;
  }
  @keyframes clickglow{0%{opacity:.9}100%{opacity:0}}

  /* —— 底部提示：极淡，几秒后进一步隐去 —— */
  .tip{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;
    font-size:10.5px;letter-spacing:.2em;color:rgba(255,235,246,.3);
    text-shadow:0 0 10px rgba(255,140,190,.12);z-index:3;pointer-events:none;
    transition:opacity 3s ease;}
  .tip.fade{opacity:.32;}

  @media (max-width:480px){
    .tools{right:10px;top:10px;gap:6px;}
    .tools button{padding:6px 10px;font-size:11px;letter-spacing:.06em;}
    .greet{left:6.5vw;top:9.2vh;}
    .palette{left:10px;top:10px;}
    .palette .sw{width:44px;font-size:10.5px;letter-spacing:.04em;}
    .palette .pthumb{height:26px;}
  }

  /* —— 配色胶囊：内容层（玻璃由 WebGL 绘制，文字不参与折射） —— */
  .palette{position:fixed;left:12px;top:14px;display:flex;align-items:center;gap:0;
    padding:3px;border-radius:13px;z-index:5;background:none;box-shadow:none;
    opacity:0;pointer-events:none;animation:uiIn 1.3s ease 4.05s forwards;
  }
  .palette .sw{
    position:relative;z-index:3;width:52px;height:26px;border-radius:9px;
    appearance:none;border:0;padding:0;cursor:pointer;background:none;
    font:600 11.5px/1 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    letter-spacing:.08em;color:rgba(255,255,255,.62);
    transition:color .35s ease;
    will-change:transform;
  }
  .palette .sw.on{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.55);}

  /* —— 蓝色主题 —— */
  body.blue .bg{
    background:
      radial-gradient(circle at 50% 40%, rgba(90,175,255,.15), transparent 46%),
      radial-gradient(circle at 50% 100%, rgba(120,220,255,.14), transparent 44%),
      radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.6) 100%);
  }
  body.blue .greet h1{
    background-image:linear-gradient(100deg,#f8feff 0%,#e2f3ff 18%,#8fd9ff 36%,#c9ecff 52%,#ffffff 68%,#97d8ff 86%,#f2fbff 100%);
    background-size:240% 100%;
    filter:drop-shadow(0 0 6px rgba(150,210,255,.6)) drop-shadow(0 0 18px rgba(80,170,255,.45)) drop-shadow(0 0 42px rgba(60,150,255,.28));
  }
  body.blue .greet p{text-shadow:0 0 10px rgba(140,205,255,.85),0 0 26px rgba(80,165,255,.45);}
  body.blue .tip{color:rgba(226,240,255,.3);text-shadow:0 0 10px rgba(130,195,255,.12);}
  body.blue .tools button.on{
    background:
      linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)),
      linear-gradient(180deg, rgba(176,224,255,.42), rgba(92,170,255,.2) 60%, rgba(62,142,240,.14) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(206,240,255,.62),
      inset 1px 0 0 rgba(255,192,224,.55),
      inset -1px 0 0 rgba(88,178,255,.8),
      inset 0 0 22px rgba(95,175,255,.5),
      0 0 24px rgba(80,160,255,.5);
    text-shadow:0 0 10px rgba(140,205,255,.8);
  }
  body.blue .tools button.on .dot{
    background:#f3fbff;
    box-shadow:0 0 6px #fff,0 0 13px rgba(120,200,255,.95),0 0 22px rgba(80,160,255,.6);
  }
  body.blue .palette .pthumb{
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.7),
      inset 0 2px 4px rgba(255,255,255,.5),
      inset 0 -4px 8px rgba(0,0,0,.25),
      0 0 14px rgba(90,175,255,.5);
  }


  /* —— 绿色主题（经典圣诞树） —— */
  body.green .bg{
    background:
      radial-gradient(circle at 50% 40%, rgba(70,210,140,.13), transparent 46%),
      radial-gradient(circle at 50% 100%, rgba(255,205,130,.13), transparent 44%),
      radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.62) 100%);
  }
  body.green .greet h1{
    background-image:linear-gradient(100deg,#f9fffb 0%,#dcf9e7 18%,#6ce29c 36%,#ffe3a6 52%,#ffffff 68%,#7ce7a7 86%,#f0fff7 100%);
    background-size:240% 100%;
    filter:drop-shadow(0 0 6px rgba(130,240,178,.6)) drop-shadow(0 0 18px rgba(60,200,132,.45)) drop-shadow(0 0 42px rgba(40,170,110,.28));
  }
  body.green .greet p{text-shadow:0 0 10px rgba(155,245,195,.85),0 0 26px rgba(70,200,135,.45);}
  body.green .tip{color:rgba(230,255,242,.3);text-shadow:0 0 10px rgba(130,230,175,.12);}
  body.green .tools button.on{
    background:
      linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)),
      linear-gradient(180deg, rgba(188,246,212,.36), rgba(70,190,122,.2) 60%, rgba(42,152,92,.14) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(214,250,228,.62),
      inset 1px 0 0 rgba(255,222,162,.55),
      inset -1px 0 0 rgba(82,212,142,.78),
      inset 0 0 22px rgba(85,212,145,.46),
      0 0 24px rgba(70,190,125,.46);
    text-shadow:0 0 10px rgba(155,245,195,.8);
  }
  body.green .tools button.on .dot{
    background:#f3fff8;
    box-shadow:0 0 6px #fff,0 0 13px rgba(120,235,172,.92),0 0 22px rgba(60,190,120,.6);
  }
  body.green .palette .pthumb{
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.7),
      inset 0 2px 4px rgba(255,255,255,.5),
      inset 0 -4px 8px rgba(0,0,0,.25),
      0 0 14px rgba(80,200,130,.45);
  }

  /* —— 开场：两幕字幕 + 点亮 —— */
  #intro{position:fixed;inset:0;z-index:9;pointer-events:none;
    background:radial-gradient(circle at 50% 46%, rgba(16,6,24,.965) 0%, rgba(5,2,11,.99) 66%, rgba(3,1,8,1) 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:opacity 1.15s ease, visibility 1.15s ease;}
  #intro.hide{opacity:0;visibility:hidden;}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;opacity:0;padding:0 24px;}
  .stage-a{animation:stageIn 2.1s cubic-bezier(.22,.9,.25,1) .1s both;}
  .stage-b{animation:stageIn 2.2s cubic-bezier(.22,.9,.25,1) 1.95s both;}
  @keyframes stageIn{
    0%{opacity:0;transform:scale(.94);filter:blur(7px);}
    16%{opacity:1;transform:scale(1);filter:blur(0);}
    76%{opacity:1;transform:scale(1.005);filter:blur(0);}
    100%{opacity:0;transform:scale(1.05);filter:blur(4px);}
  }
  @keyframes sheen{0%{background-position:0% 50%}100%{background-position:240% 50%}}
  @keyframes uiIn{from{opacity:0}to{opacity:1}}
  .intro-kicker{font-size:11px;letter-spacing:.6em;color:rgba(255,226,238,.55);text-transform:uppercase;padding-left:.6em;}
  .intro-script{
    font-family:"Alex Brush","Great Vibes",cursive;
    font-size:clamp(48px,11.5vw,104px);line-height:1.02;
    background:linear-gradient(100deg,#fffafc,#ffe4f0 22%,#ffb2d3 40%,#ffdca8 56%,#fffdf9 72%,#ffc0dc 100%);
    background-size:240% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,155,200,.6)) drop-shadow(0 0 36px rgba(255,105,165,.45));
    animation:sheen 5s linear infinite;
  }
  .intro-cn{font-size:clamp(19px,5vw,36px);font-weight:700;letter-spacing:.2em;color:#fff;
    text-shadow:0 0 14px rgba(255,150,200,.9),0 0 38px rgba(255,110,170,.5);}
  .intro-en{font-family:"Alex Brush","Great Vibes",cursive;font-size:clamp(17px,3.6vw,25px);
    color:rgba(255,216,234,.85);text-shadow:0 0 16px rgba(255,130,185,.55);}
  .intro-line{width:min(54vw,330px);height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,192,216,.85),transparent);
    box-shadow:0 0 14px rgba(255,140,190,.7);}
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="bg"></div>
<div class="greet">
  <h1>Merry Christmas</h1>
  <p>节日快乐，刘映佑！</p>
</div>
<div class="tools">
  <button id="bAuto" class="on"><span class="dot"></span><span class="lb">自转</span></button>
  <button id="bSnow" class="on"><span class="dot"></span><span class="lb">飘雪</span></button>
  <button id="bHeavy"><span class="dot"></span><span class="lb">大雪</span></button>
</div>
<div class="palette" id="palette">
  <button class="sw on" data-theme="pink">粉色</button>
  <button class="sw" data-theme="blue">蓝色</button>
  <button class="sw" data-theme="green">绿色</button>
</div>
<div class="tip" id="tip">拖动旋转 · 双指缩放 · 双击复位</div>

<div id="intro">
  <div class="stage stage-a">
    <div class="intro-kicker">Christmas 2026</div>
    <div class="intro-script">Merry Christmas</div>
    <div class="intro-line"></div>
    <div class="intro-en">the lights are coming on, one by one</div>
  </div>
  <div class="stage stage-b">
    <div class="intro-en">Merry Christmas</div>
    <div class="intro-cn">节日快乐，刘映佑！</div>
    <div class="intro-line"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ================= 基础工具 ================= */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const CW = 1080, CH = 1920;
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(CW, CH, false);
renderer.setClearColor(0x04020a, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, CW / CH, 0.1, 300);
const LOOK_Y = 2.68;

/* 画布按 9:16 等比铺满视口（cover），不做非等比拉伸 */
const layout = { scale: 1, ox: 0, oy: 0 };
function layoutCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const sc = Math.max(vw / CW, vh / CH);
  const w = CW * sc, h = CH * sc;
  layout.scale = sc;
  layout.ox = (vw - w) / 2;
  layout.oy = (vh - h) / 2;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.left = layout.ox + 'px';
  canvas.style.top = layout.oy + 'px';
}
layoutCanvas();
/* ================= 三层渲染管线：Background → Glass → Content ================= */
const paintRT = new THREE.WebGLRenderTarget(CW, CH, {
  minFilter: THREE.LinearMipmapLinearFilter,
  magFilter: THREE.LinearFilter,
  generateMipmaps: true,
  depthBuffer: true,
  stencilBuffer: false,
  type: THREE.UnsignedByteType
});
paintRT.texture.colorSpace = THREE.NoColorSpace;

const compScene = new THREE.Scene();
const compCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
compCam.position.set(0, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);

function srgbOut(c) {
  return 'pow(max(' + c + ', vec3(0.0)), vec3(1.0 / 2.2))';
}

const bgMat = new THREE.ShaderMaterial({
  uniforms: { uBg: { value: paintRT.texture } },
  depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: [
    'uniform sampler2D uBg;',
    'varying vec2 vUv;',
    'void main(){',
    '  vec3 c = texture2D(uBg, vUv).rgb;',
    '  gl_FragColor = vec4(pow(max(c, vec3(0.0)), vec3(1.0/2.2)), 1.0);',
    '}'
  ].join('\n')
});
const bgMesh = new THREE.Mesh(quadGeo, bgMat);
bgMesh.renderOrder = 0;
bgMesh.frustumCulled = false;
compScene.add(bgMesh);

const glassUniforms = {
  uBg: { value: paintRT.texture },
  uRes: { value: new THREE.Vector2(CW, CH) },
  uCenter: { value: new THREE.Vector2(CW * 0.1, 40) },
  uHalf: { value: new THREE.Vector2(81, 16) },
  uRadius: { value: 13 },
  uIOR: { value: 1.46 },
  uDisp: { value: 0.035 },
  uTime: { value: 0 },
  uFluid: { value: new THREE.Vector2(0, 0) },
  uQuadMin: { value: new THREE.Vector2(0, 0) },
  uQuadSize: { value: new THREE.Vector2(200, 80) },
  uThick: { value: 0.016 },
  uBevel: { value: 0.05 },
  uTrans: { value: 3.0 },
  uBgDist: { value: 0.9 }
};

const glassFrag = [
  'precision highp float;',
  'uniform sampler2D uBg;',
  'uniform vec2 uRes;',
  'uniform vec2 uCenter;',
  'uniform vec2 uHalf;',
  'uniform float uRadius;',
  'uniform float uIOR;',
  'uniform float uDisp;',
  'uniform float uTime;',
  'uniform vec2 uFluid;',
  'uniform float uThick;',
  'uniform float uBevel;',
  'uniform float uTrans;',
  'uniform float uBgDist;',
  'uniform vec2 uQuadMin;',
  'uniform vec2 uQuadSize;',
  'varying vec2 vUv;',
  'out vec4 outColor;',
  'const float PI = 3.141592653589793;',
  '',
  'float sdRound(vec2 p, vec2 b, float r){',
  '  vec2 q = abs(p) - b + r;',
  '  return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;',
  '}',
  'float heightFrom(float sdf, float bevel, float thick){',
  '  float inr = max(-sdf, 0.0);',
  '  float t = clamp(inr / bevel, 0.0, 1.0);',
  '  float k = t*t*t*(t*(t*6.0-15.0)+10.0);',
  '  return thick * k;',
  '}',
  'float D_GGX(float NoH, float a){',
  '  float a2 = a*a;',
  '  float d = (NoH*a2 - NoH)*NoH + 1.0;',
  '  return a2 / (PI*d*d + 1e-7);',
  '}',
  'float V_SmithCorrelated(float NoV, float NoL, float a){',
  '  float a2 = a*a;',
  '  float gv = NoL*sqrt(NoV*NoV*(1.0-a2)+a2);',
  '  float gl = NoV*sqrt(NoL*NoL*(1.0-a2)+a2);',
  '  return 0.5/max(gv+gl, 1e-6);',
  '}',
  'vec3 F_Schlick(vec3 f0, float u){',
  '  return f0 + (1.0-f0)*pow(1.0-u, 5.0);',
  '}',
  'vec2 clampUV(vec2 uv){ return clamp(uv, vec2(0.0015), vec2(0.9985)); }',
  'vec3 dispSample(vec2 uv, float lod, float disp, vec2 oc){',
  '  vec2 d = uv - oc;',
  '  float r = textureLod(uBg, clampUV(oc + d*(1.0-disp)), lod).r;',
  '  float g = textureLod(uBg, clampUV(uv), lod).g;',
  '  float b = textureLod(uBg, clampUV(oc + d*(1.0+disp)), lod).b;',
  '  return vec3(r, g, b);',
  '}',
  '',
  'void main(){',
  '  float aspect = uRes.x / uRes.y;',
  '  vec2 screenUV = (uQuadMin + vUv * uQuadSize) / uRes;',
  '  vec2 p = (screenUV - 0.5) * vec2(aspect, 1.0);',
  '  vec2 c = (uCenter / uRes - 0.5) * vec2(aspect, 1.0);',
  '  vec2 b = (uHalf / uRes) * vec2(aspect, 1.0);',
  '  float rad = uRadius / uRes.y;',
  '  float trans = max(uTrans, 1.0) / uRes.y;',
  '  vec2 fl = uFluid / uRes.y;',
  '  vec2 q = p - c;',
  '',
  '  /* 流动形变：速度驱动、时间连续 */',
  '  float spd = length(fl);',
  '  float wob = 0.012 * min(1.0, max(0.0, spd - 0.0004) * 26.0);',
  '  vec2 flow = fl * 1.2 + vec2(',
  '    sin(q.y * 20.0 + uTime * 1.8) + sin(q.x * 7.0 - uTime * 1.2),',
  '    cos(q.x * 17.0 - uTime * 1.5) + sin(q.y * 9.0 + uTime * 1.1)',
  '  ) * wob;',
  '  vec2 qd = q - flow;',
  '',
  '  float sdf = sdRound(qd, b, rad);',
  '  float sdfClean = sdRound(q, b, rad);',
  '  float interior = max(-sdfClean, 0.0);',
  '  float bevel = max(trans * 0.82, 0.004);',
  '  float hh = heightFrom(sdfClean, bevel, uThick);',
  '',
  '  /* 高度场法线（低噪声 SDF） */',
  '  float st = clamp(trans * 0.13, 0.003, 0.012);',
  '  float hR = heightFrom(sdRound(q + vec2(st, 0.0), b, rad), bevel, uThick);',
  '  float hL = heightFrom(sdRound(q - vec2(st, 0.0), b, rad), bevel, uThick);',
  '  float hU = heightFrom(sdRound(q + vec2(0.0, st), b, rad), bevel, uThick);',
  '  float hD = heightFrom(sdRound(q - vec2(0.0, st), b, rad), bevel, uThick);',
  '  vec2 grad = vec2(hR - hL, hU - hD) / (2.0 * st);',
  '  vec3 N = normalize(vec3(-grad, 1.0));',
  '',
  '  /* 双界面折射 */',
  '  vec3 I = vec3(0.0, 0.0, -1.0);',
  '  vec3 dirIn = refract(I, N, 1.0 / uIOR);',
  '  if (dot(dirIn, dirIn) < 0.004) dirIn = I;',
  '  float path = hh / max(-dirIn.z, 0.025);',
  '  vec3 exitP = vec3(q, hh) + dirIn * path;',
  '  vec3 dirOut = refract(dirIn, vec3(0.0, 0.0, 1.0), uIOR);',
  '  if (dot(dirOut, dirOut) < 0.004) dirOut = dirIn;',
  '  float tt = (-uBgDist - exitP.z) / min(dirOut.z, -1e-4);',
  '  vec2 hit = exitP.xy + dirOut.xy * tt;',
  '  vec2 greenUV = vec2(hit.x / aspect, hit.y) + 0.5;',
  '',
  '  vec2 uv = screenUV;',
  '  vec2 uvC = uCenter / uRes;',
  '  float band = clamp(interior / bevel, 0.0, 1.0);',
  '  vec2 rimDir = -normalize(grad + vec2(1e-5));',
  '  float rimDisp = (1.0 - band) * 0.015;',
  '  vec2 rimUV = vec2(rimDir.x / aspect, rimDir.y) * rimDisp;',
  '',
  '  /* Face / Inner / Outer */',
  '  vec2 faceUV = uvC + (uv - uvC) * 0.975;',
  '  vec2 innerUV = greenUV - rimUV;',
  '  vec2 outerUV = uv + rimUV * 1.28;',
  '  vec3 faceC = textureLod(uBg, clampUV(faceUV), 2.1).rgb;',
  '  vec3 innerC = dispSample(innerUV, 0.8, uDisp, uvC);',
  '  vec3 outerC = dispSample(outerUV, 3.0, uDisp * 1.2, uvC);',
  '',
  '  float faceW = smoothstep(0.55, 0.95, band);',
  '  float outerW = 1.0 - smoothstep(0.0, 0.30, band);',
  '  float innerW = max(0.0, 1.0 - faceW - outerW);',
  '  float wsum = max(faceW + innerW + outerW, 1e-4);',
  '  vec3 refr = (faceC * faceW + innerC * innerW + outerC * outerW) / wsum;',
  '',
  '  /* 倒角支撑 + GGX 四点掠射 */',
  '  float support = 1.0 - smoothstep(0.35, 0.85, band);',
  '  float curv = clamp(length(grad) * 6.0, 0.0, 1.0);',
  '  float sup = support * (0.35 + 0.65 * curv);',
  '  vec3 V = vec3(0.0, 0.0, 1.0);',
  '  vec3 Ld[4];',
  '  Ld[0] = normalize(vec3( 0.92, 0.34, 0.34));',
  '  Ld[1] = normalize(vec3(-0.90, 0.41, 0.38));',
  '  Ld[2] = normalize(vec3( 0.36,-0.93, 0.30));',
  '  Ld[3] = normalize(vec3(-0.38,-0.90, 0.42));',
  '  vec3 Lc[4];',
  '  Lc[0] = vec3(1.0, 0.96, 0.92);',
  '  Lc[1] = vec3(0.92, 0.96, 1.0);',
  '  Lc[2] = vec3(1.0, 0.93, 0.88);',
  '  Lc[3] = vec3(0.90, 0.94, 1.0);',
  '  float rough = 0.16;',
  '  float a = rough * rough;',
  '  float F0 = pow((uIOR - 1.0) / (uIOR + 1.0), 2.0);',
  '  vec3 spec = vec3(0.0);',
  '  for (int i = 0; i < 4; i++) {',
  '    vec3 L = Ld[i];',
  '    vec3 H = normalize(L + V);',
  '    float NoL = max(dot(N, L), 0.0);',
  '    float NoV = max(dot(N, V), 0.0);',
  '    float NoH = max(dot(N, H), 0.0);',
  '    float VoH = max(dot(V, H), 0.0);',
  '    vec3 F = F_Schlick(vec3(F0), VoH);',
  '    spec += D_GGX(NoH, a) * V_SmithCorrelated(NoV, NoL, a) * F * NoL * Lc[i];',
  '  }',
  '  spec *= 0.55 * sup;',
  '  float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0) * sup;',
  '  vec3 rimTint = vec3(0.80, 0.92, 1.0);',
  '',
  '  vec3 glass = refr * vec3(0.985, 1.0, 1.015);',
  '  float edgePx = interior * uRes.y;',
  '  float hair = exp(-edgePx / 0.85);',
  '  float softRim = exp(-edgePx / 3.2);',
  '  float bodyMask = smoothstep(0.0, 1.6, edgePx);',
  '  float rimGrad = 0.55 + 0.45 * normalize(N.xy + vec2(1e-4)).y;',
  '  float topLight = 0.55 + 0.45 * (vUv.y - 0.5) * 2.0;',
  '  glass += vec3(0.95, 0.97, 1.0) * hair * (0.55 + 0.25 * rimGrad);',
  '  glass += rimTint * softRim * 0.16;',
  '  glass += spec * topLight * 0.9;',
  '  glass += vec3(0.90, 0.95, 1.06) * smoothstep(0.35, 1.0, vUv.y) * 0.10 * bodyMask;',
  '  glass += vec3(0.26, 0.33, 0.46) * bodyMask * 0.13;',
  '  glass += vec3(0.95, 0.97, 1.0) * smoothstep(0.22, 0.02, vUv.y) * 0.03 * bodyMask;',
  '',
  '  float aa = max(fwidth(sdf), 1e-5) * 1.2;',
  '  float mask = smoothstep(-aa, aa, -sdf);',
  '  if (sdf > 0.05) discard;',
  '  vec3 col = glass;',
  '  col = pow(max(col, vec3(0.0)), vec3(1.0 / 2.2));',
  '  outColor = vec4(col, mask);',
  '}'
].join('\n');

const glassMat = new THREE.ShaderMaterial({
  uniforms: glassUniforms,
  glslVersion: THREE.GLSL3,
  transparent: true,
  depthTest: false,
  depthWrite: false,
  vertexShader: 'out vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: glassFrag
});
const glassMesh = new THREE.Mesh(quadGeo, glassMat);
glassMesh.renderOrder = 1;
glassMesh.frustumCulled = false;
compScene.add(glassMesh);

function composeUpdate(t) {
  const rect = paletteEl.getBoundingClientRect();
  if (!rect.width) return;
  const cx = (rect.left + rect.width * 0.5 - layout.ox) / layout.scale;
  const cy = (rect.top + rect.height * 0.5 - layout.oy) / layout.scale;
  const hw = rect.width * 0.5 / layout.scale;
  const hh = rect.height * 0.5 / layout.scale;
  glassUniforms.uCenter.value.set(cx, cy);
  glassUniforms.uHalf.value.set(hw, hh);
  const rad = parseFloat(getComputedStyle(paletteEl).borderRadius) || 13;
  glassUniforms.uRadius.value = rad / layout.scale;
  const fpx = Math.abs(fluidPX) < 0.25 ? 0 : fluidPX;
  const fpy = Math.abs(fluidPY) < 0.25 ? 0 : fluidPY;
  glassUniforms.uFluid.value.set(fpx / layout.scale, fpy / layout.scale);
  glassUniforms.uTime.value = t;

  const pad = 34;
  const qw = hw * 2 + pad, qh = hh * 2 + pad;
  glassMesh.scale.set(qw / CW, qh / CH, 1);
  glassMesh.position.set((cx / CW) * 2 - 1, 1 - (cy / CH) * 2, 0);
  glassUniforms.uQuadMin.value.set(cx - hw - pad * 0.5, cy - hh - pad * 0.5);
  glassUniforms.uQuadSize.value.set(qw, qh);
}

function renderFrame() {
  renderer.setRenderTarget(paintRT);

  renderer.render(compScene, compCam);
}


/* ================= 光点贴图 ================= */
const GLOW_TEX = (() => {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.16, 'rgba(255,255,255,0.88)');
  g.addColorStop(0.40, 'rgba(255,255,255,0.30)');
  g.addColorStop(0.72, 'rgba(255,255,255,0.07)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s / 2, s / 2, s / 2, 0, TAU);
  ctx.fill();
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  return tex;
})();

/* ================= 粒子构建器 ================= */
function nb() { return { P: [], C: [], S: [], PH: [] }; }
function put(b, x, y, z, color, size) {
  b.P.push(x, y, z);
  b.C.push(color.r, color.g, color.b);
  b.S.push(size);
  b.PH.push(Math.random());
}
function toGeo(b) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(b.P, 3));
  geo.setAttribute('aColor', new THREE.Float32BufferAttribute(b.C, 3));
  geo.setAttribute('aSize', new THREE.Float32BufferAttribute(b.S, 1));
  geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(b.PH, 1));
  return geo;
}

/* ================= 材质 ================= */
const PART_VERT = `
  uniform float uTime;
  uniform float uSize;
  uniform float uPixel;
  uniform float uPulse;
  uniform float uTwinkleSpeed;
  attribute float aSize;
  attribute float aPhase;
  attribute vec3 aColor;
  varying vec3 vColor;
  varying float vBright;
  void main() {
    vColor = aColor;
    float tw = 0.70 + 0.30 * sin(uTime * uTwinkleSpeed + aPhase * 6.2831);
    vBright = 0.40 + 0.60 * tw;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uSize * uPulse * uPixel * (1.0 + tw * 0.22) * (430.0 / max(-mv.z, 0.001));
    gl_Position = projectionMatrix * mv;
  }
`;
const PART_FRAG = `
  uniform sampler2D uMap;
  uniform float uOpacity;
  varying vec3 vColor;
  varying float vBright;
  void main() {
    vec4 tex = texture2D(uMap, gl_PointCoord);
    gl_FragColor = vec4(vColor, tex.a * uOpacity * vBright);
  }
`;
function particleMaterial(sizeScale, opacity, twinkleSpeed) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uMap: { value: GLOW_TEX },
      uTime: { value: 0 },
      uSize: { value: sizeScale },
      uPixel: { value: renderer.getPixelRatio() },
      uPulse: { value: 1 },
      uOpacity: { value: opacity },
      uTwinkleSpeed: { value: twinkleSpeed }
    },
    vertexShader: PART_VERT,
    fragmentShader: PART_FRAG,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending
  });
}

/* —— 螺旋树体 —— */
for (let i = 0; i < 78000; i++) {
  const t = Math.pow(Math.random(), 1.15);              // 0 底部 → 1 顶部
  const rMax = R * Math.pow(1 - t, 0.88) + 0.015;
  const ang = t * TURNS * TAU + gauss() * 0.2;
  let rf = 1 + gauss() * 0.075;
  if (Math.random() < 0.36) rf = Math.pow(Math.random(), 0.5);   // 内部弥漫
  const r = rMax * rf;
  const y = t * H + gauss() * 0.022;

  const pick = Math.random();
  if (pick < 0.55) _c.copy(ROSE).lerp(WHITE, Math.random() * 0.62);
  else if (pick < 0.86) _c.copy(WHITE);
  else _c.copy(GOLD).lerp(WHITE, Math.random() * 0.55);
  _c.multiplyScalar(0.72 + Math.random() * 0.26);

  put(treeB, Math.cos(ang) * r, y, Math.sin(ang) * r, _c, Math.random() < 0.14 ? 0.045 + Math.random() * 0.03 : 0.026 + Math.random() * 0.03);
}

function confettiColor() {
  const q = Math.random();
  if (q < 0.28) _c.set('#2ee58a');
  else if (q < 0.42) _c.set('#17c46d');
  else if (q < 0.58) _c.set('#ffe45c');
  else if (q < 0.70) _c.set('#a8f56a');
  else if (q < 0.80) _c.set('#7ff0ff');
  else if (q < 0.88) _c.set('#58c8ff');
  else if (q < 0.94) _c.set('#ffab4d');
  else _c.set('#ff86d0');
  return _c;
}

/* 松树层：每一层底部外撑、往上收，层与层之间留下凹口 */
const TIER_N = 7;
const TH = GH * 0.95;

function tierRadius(y) {
  const f = Math.min(0.999, Math.max(0, y / TH));
  const k = Math.floor(f * TIER_N);
  const local = f * TIER_N - k;
  const rb = GR * Math.pow(1 - k / TIER_N, 1.06);
  const rt = rb * 0.44;
  return rt + (rb - rt) * Math.pow(1 - local, 1.15);
}

/* 通用五角星 */
function starVerts(radius) {
  const v = [];
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rad = (i % 2 === 0) ? radius : radius * 0.44;
    v.push([Math.cos(ang) * rad, Math.sin(ang) * rad]);
  }
  return v;
}
function addStar(buf, cy, radius, count, colA, colB) {
  const verts = starVerts(radius);
  for (let i = 0; i < count; i++) {
    const t = Math.floor(Math.random() * 10);
    const b = verts[t], c = verts[(t + 1) % 10];
    let u = Math.random(), v = Math.random();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    _c.copy(colA).lerp(colB, Math.random() * 0.8).multiplyScalar(0.88 + Math.random() * 0.18);
    put(buf, u * b[0] + v * c[0], cy + u * b[1] + v * c[1], gauss() * 0.03, _c, 0.026 + Math.random() * 0.040);
  }
  for (let i = 0; i < 10; i++) {
    const p2 = verts[i], q2 = verts[(i + 1) % 10];
    for (let s2 = 0; s2 < 26; s2++) {
      const t2 = s2 / 26;
      _c.copy(colA).lerp(WHITE, 0.5).multiplyScalar(0.95);
      put(buf, p2[0] + (q2[0] - p2[0]) * t2, cy + p2[1] + (q2[1] - p2[1]) * t2, gauss() * 0.02, _c, 0.032 + Math.random() * 0.034);
    }
  }
}

function makeGift(size, boxColor, ribbonColor) {
  const g = new THREE.Group();
  const boxMat = new THREE.MeshStandardMaterial({
    color: boxColor, roughness: 0.42, metalness: 0.18,
    emissive: new THREE.Color(boxColor).multiplyScalar(0.2)
  });
  const ribMat = new THREE.MeshStandardMaterial({
    color: ribbonColor, roughness: 0.28, metalness: 0.72,
    emissive: new THREE.Color(ribbonColor).multiplyScalar(0.5)
  });
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEX, color: 0xffb8d6, transparent: true, opacity: 0.42,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  halo.scale.set(size * 5.2, size * 5.2, 1);
  halo.position.y = size * 0.4;
  g.add(halo);

  const box = new THREE.Mesh(new THREE.BoxGeometry(size, size * 0.82, size), boxMat);
  box.position.y = size * 0.41;
  g.add(box);

  const rw = size * 0.13;
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(rw, size * 0.84, size * 1.005), ribMat);
  r1.position.y = size * 0.41;
  const r2 = new THREE.Mesh(new THREE.BoxGeometry(size * 1.005, size * 0.84, rw), ribMat);
  r2.position.y = size * 0.41;
  g.add(r1, r2);

  const bowT = new THREE.TorusGeometry(size * 0.19, size * 0.035, 8, 22);
  const b1 = new THREE.Mesh(bowT, ribMat);
  b1.position.set(-size * 0.12, size * 0.85, 0);
  b1.rotation.set(Math.PI * 0.5, 0, Math.PI * 0.22);
  const b2 = b1.clone();
  b2.position.x = size * 0.12;
  b2.rotation.z = -Math.PI * 0.22;
  const knot = new THREE.Mesh(new THREE.SphereGeometry(size * 0.075, 12, 10), ribMat);
  knot.position.set(0, size * 0.85, 0);
  g.add(b1, b2, knot);
  return g;
}

const snowMat = new THREE.ShaderMaterial({
  uniforms: {
    uMap: { value: GLOW_TEX },
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() },
    uSize: { value: 1 },
    uOpacity: { value: 0.95 }

  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uSize;
    attribute float aSize;
    attribute float aSpeed;
    attribute float aPhase;
    varying float vA;
    void main() {
      vec3 p = position;
      float span = 15.0;
      p.y = mod(p.y - uTime * aSpeed, span);
      p.x += sin(uTime * 0.45 + aPhase * 6.2831) * 0.55;
      p.z += cos(uTime * 0.35 + aPhase * 4.2) * 0.4;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = aSize * uSize * uPixel * (430.0 / max(-mv.z, 0.001));
      gl_Position = projectionMatrix * mv;
      vA = 0.55 + 0.45 * sin(uTime * 1.2 + aPhase * 12.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uMap;
    uniform float uOpacity;
    varying float vA;
    void main() {
      vec4 tex = texture2D(uMap, gl_PointCoord);
      gl_FragColor = vec4(vec3(0.88, 0.92, 1.0), tex.a * vA * uOpacity);
    }
  `,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});

const pointers = new Map();
let lastX = 0, lastY = 0, pinchStart = 0, pinchDist = 0;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    lastX = e.clientX; lastY = e.clientY;
  } else if (pointers.size === 2) {
    const p = [...pointers.values()];
    pinchStart = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    pinchDist = view.tDist;
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    view.tTheta -= dx * 0.0062;
    view.tPhi = clamp(view.tPhi - dy * 0.005, 0.42, 1.62);
  } else if (pointers.size >= 2) {
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    if (pinchStart > 10) view.tDist = clamp(pinchDist * pinchStart / d, 4.8, 20);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = 0;
  if (pointers.size === 0) pinchStart = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.tDist = clamp(view.tDist * (1 + e.deltaY * 0.0011), 4.8, 20);
}, { passive: false });

canvas.addEventListener('dblclick', () => {
  view.tTheta = view.theta + 0.4;
  view.tPhi = DEF.phi;
  view.tDist = DEF.dist;
});

function setTheme(t) {
  theme = t;
  document.body.classList.toggle('blue', t === 'blue');
  document.body.classList.toggle('green', t === 'green');
  spiralGroup.visible = t === 'pink';
  greenGroup.visible = t === 'green';
  blueGroup.visible = t === 'blue';
  paletteEl.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
}
const swEls = [...paletteEl.querySelectorAll('.sw')];
let palLastX = null, palLastY = null;
let fluidVX = 0, fluidVY = 0, fluidPX = 0, fluidPY = 0;

window.addEventListener('resize', () => setTheme(theme));
setTheme('pink');

paletteEl.addEventListener('pointermove', e => {
  const dx = palLastX === null ? 0 : e.clientX - palLastX;
  const dy = palLastY === null ? 0 : e.clientY - palLastY;
  palLastX = e.clientX;
  palLastY = e.clientY;
  fluidVX = Math.max(-26, Math.min(26, dx * 1.3));
  fluidVY = Math.max(-26, Math.min(26, dy * 1.3));
});
swEls.forEach(b => {
  b.addEventListener('click', () => setTheme(b.dataset.theme));
});
paletteEl.addEventListener('pointerleave', () => { palLastX = null; palLastY = null; fluidVX = 0; fluidVY = 0; });
paletteEl.addEventListener('pointercancel', () => { palLastX = null; palLastY = null; fluidVX = 0; fluidVY = 0; });

function updateFluid() {
  fluidVX *= 0.9;
  fluidVY *= 0.9;
  fluidPX += (fluidVX - fluidPX) * 0.16;
  fluidPY += (fluidVY - fluidPY) * 0.16;
  swEls.forEach((b, idx) => {
    const d = fluidPX * 0.3 * (1 + idx * 0.14);
    const s = fluidPY * 0.1;
    b.style.transform = 'translate(' + d.toFixed(2) + 'px,' + s.toFixed(2) + 'px) skewX(' + (fluidPX * 0.22).toFixed(2) + 'deg)';
    b.style.textShadow =
      '0 0 ' + (Math.abs(d) * 0.7 + 4).toFixed(1) + 'px rgba(255,255,255,.3),' +
      (-d * 0.5).toFixed(1) + 'px 0 7px rgba(255,90,195,.38),' +
      (d * 0.5).toFixed(1) + 'px 0 7px rgba(95,220,255,.38)';
  });
}

/* ================= 液态玻璃交互 ================= */
document.querySelectorAll('.tools button').forEach(btn => {
  btn.addEventListener('click', () => {
    const g = document.createElement('i');
    g.className = 'clickglow';
    btn.appendChild(g);
    setTimeout(() => g.remove(), 760);
  });
});

document.querySelectorAll('.tools button').forEach(btn => {
  let pressed = false;

  btn.addEventListener('pointermove', e => {
    const r = btn.getBoundingClientRect();
    btn.style.setProperty('--mx', (((e.clientX - r.left) / r.width) * 100).toFixed(1) + '%');
    btn.style.setProperty('--my', (((e.clientY - r.top) / r.height) * 100).toFixed(1) + '%');
  });
  btn.addEventListener('pointerleave', () => {
    btn.style.setProperty('--mx', '50%');
    btn.style.setProperty('--my', '22%');
  });

  btn.addEventListener('pointerdown', e => {
    pressed = true;
    btn.classList.remove('boing');
    btn.classList.add('press');
    const r = btn.getBoundingClientRect();
    const rip = document.createElement('i');
    rip.className = 'ripple';
    rip.style.left = (e.clientX - r.left) + 'px';
    rip.style.top = (e.clientY - r.top) + 'px';
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 700);
  });

  function release() {
    if (!pressed) return;
    pressed = false;
    btn.classList.remove('press');
    btn.classList.add('boing');
    setTimeout(() => btn.classList.remove('boing'), 640);
  }
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);
});

/* ================= 尺寸 ================= */
function resize() {
  layoutCanvas();
  renderer.setPixelRatio(1);
  renderer.setSize(CW, CH, false);
  camera.aspect = CW / CH;
  camera.updateProjectionMatrix();
  [treeMat, treeMatGlow, heartMat, heartMatGlow, sparkMat, greenMat, greenGlowMat, blueMat, blueGlowMat].forEach(m => {
    m.uniforms.uPixel.value = renderer.getPixelRatio();
  });
  snowMat.uniforms.uPixel.value = renderer.getPixelRatio();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let time = 0;
let lowFpsAcc = 0, lowFpsFrames = 0, qualityChecked = false;
let snowBoost = 0;
const allMats = [treeMat, treeMatGlow, heartMat, heartMatGlow, sparkMat, greenMat, greenGlowMat, blueMat, blueGlowMat];
updateFluid();

const sparkPos = sparkGeo.attributes.position.array;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  /* 相机阻尼 */
  view.theta += (view.tTheta - view.theta) * Math.min(1, dt * 7);
  view.phi += (view.tPhi - view.phi) * Math.min(1, dt * 7);
  view.dist += (view.tDist - view.dist) * Math.min(1, dt * 7);
  applyCamera();

  /* 入场：由内向外点亮 */
  const intro = Math.min(1, Math.max(0, (time - 1.95) / 2.3));
  const ease = 1 - Math.pow(1 - intro, 3);
  treeGroup.scale.setScalar(0.55 + 0.45 * ease);
  treeGroup.visible = true;

  /* 整体自转 */
  if (view.auto) treeGroup.rotation.y += dt * 0.22;

  /* 胶囊流体质感 */
  updateFluid();

  /* 时间 uniform */
  for (const m of allMats) m.uniforms.uTime.value = time;
  snowMat.uniforms.uTime.value = time;
  heavyMat.uniforms.uTime.value = time;

  /* 大雪：雪花变大、变密 */
  const snowTarget = view.heavy ? 1 : 0;
  snowBoost += (snowTarget - snowBoost) * Math.min(1, dt * 3.2);
  snowMat.uniforms.uSize.value = 1 + snowBoost * 0.95;
  snowMat.uniforms.uOpacity.value = 0.95 + snowBoost * 0.05;
  heavyMat.uniforms.uOpacity.value = snowBoost * 0.92;
  heavyMat.uniforms.uSize.value = 1.35 + snowBoost * 0.5;

  /* 心形跳动 */
  const pulse = 1 + Math.sin(time * 2.1) * 0.08 + Math.sin(time * 5.2) * 0.025;
  heartMat.uniforms.uPulse.value = pulse;
  heartMatGlow.uniforms.uPulse.value = pulse;

  /* 礼物轻微起伏 */
  gifts.children.forEach((g, i) => {
    g.position.y = Math.sin(time * 0.9 + i * 1.7) * 0.03;
    g.rotation.y += dt * 0.035 * (i % 2 ? 1 : -1);
  });

  /* 星火漂移 */
  for (let i = 0; i < SPARK_N; i++) {
    const s = sparkSeed[i];
    const ang = s.a + time * s.sp;
    const y = s.y + Math.sin(time * s.bob + s.ph) * 0.55;
    sparkPos[i * 3] = Math.cos(ang) * s.r;
    sparkPos[i * 3 + 1] = y;
    sparkPos[i * 3 + 2] = Math.sin(ang) * s.r;
  }
  sparkGeo.attributes.position.needsUpdate = true;

  /* 低帧率时自适应降级 */
  if (!qualityChecked) {
    lowFpsAcc += dt;
    lowFpsFrames++;
    if (lowFpsAcc > 2.5) {
      const fps = lowFpsFrames / lowFpsAcc;
      if (fps < 34) {
        treeGlow.visible = false;
        greenGlow.visible = false;
        blueGlow.visible = false;
        resize();
      }
      qualityChecked = true;
    }
  }

  composeUpdate(time);
  renderFrame();
}

applyCamera();
animate();

/* 关闭 loading */
const introEl = document.getElementById('intro');
setTimeout(() => introEl.classList.add('hide'), 4100);
setTimeout(() => { if (introEl.parentNode) introEl.remove(); }, 5400);
setTimeout(() => document.getElementById('tip').classList.add('fade'), 7000);
setTimeout(() => {
  document.querySelector('.tools').style.pointerEvents = 'auto';
  paletteEl.style.pointerEvents = 'auto';
}, 4700);
</script>
</body>
</html>
